<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/imagens/favicon.ico">
    <title>Agenda — Nexo</title>
    <link rel="stylesheet" href="agenda-estilos.css?v=20260907-lightfix3">
    <link rel="stylesheet" href="navegacao-site.css?v=20261006">
    <link rel="stylesheet" href="agenda-tema-claro-correcao.css?v=20260907-2">
    <link rel="stylesheet" href="agenda-painel-admin-estilos.css?v=20260907-1">
    <link rel="stylesheet" href="agenda-horarios-estilos.css?v=20260907-1">
    
    <link rel="stylesheet" href="agenda-tema-claro-correcao-extra.css?v=20260907-1">
    <style>.tema-opcao[data-tema="forest"],.tema-opcao[data-tema="arctic"],.tema-opcao[data-tema="ancient"]{display:none!important;}</style>
    <style>
        .filtro-agenda { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; }
        .filtro-agenda .filtro-campo { display:flex; flex-direction:column; gap:8px; }
        .filtro-agenda input[type="date"] { min-width:180px; }
        .seletor-materias { position:relative; min-width:260px; }
        .botao-materias { width:100%; min-height:42px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 13px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text); cursor:pointer; text-align:left; transition:var(--transition); }
        .botao-materias:hover, .botao-materias.aberto { border-color:var(--accent); background:var(--surface-3); }
        .botao-materias .seta { font-size:.8rem; transition:transform var(--transition); opacity:.75; }
        .botao-materias.aberto .seta { transform:rotate(180deg); }
        .resumo-materias { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .painel-materias { position:absolute; z-index:50; top:calc(100% + 7px); left:0; width:100%; max-height:300px; overflow-y:auto; padding:8px; display:none; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
        .painel-materias.aberto { display:block; }
        .opcao-materia { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer; user-select:none; }
        .opcao-materia:hover { background:var(--surface-2); }
        .opcao-materia input { width:17px; height:17px; accent-color:var(--accent); cursor:pointer; flex:0 0 auto; }
        .ajuda-materias { margin:0; font-size:.82rem; opacity:.7; }
        @media (max-width:600px) { .seletor-materias { width:100%; min-width:0; } .filtro-agenda .filtro-campo { width:100%; } .filtro-agenda input[type="date"] { width:100%; } }
    </style>
</head>
<body><header class="site-header">
<a href="/index.html" class="site-logo-link" aria-label="Ir para o Início"><img src="https://i.imgur.com/NKvDhdY.png" alt="Logo" class="site-logo"></a>
<nav class="site-tabs" aria-label="Navegação principal">
<a href="/index.html">Início</a>
<a href="/hoje.html" >Hoje</a>
<a href="/agenda.html" class="ativo" aria-current="page">Agenda</a>
</nav>
</header>
<section id="horario-aulas" class="horario-aulas" aria-labelledby="titulo-horario">
    <div class="horario-cabecalho"><div class="horario-titulo"><h2 id="titulo-horario">Horário de aulas — 8º B</h2><p>Grade semanal de segunda a sexta</p></div><button type="button" id="botao-minimizar-horario" class="botao-minimizar-horario" aria-expanded="true" aria-controls="conteudo-horario-aulas" aria-label="Minimizar horário de aulas" title="Minimizar horário">−</button></div>
    <div id="conteudo-horario-aulas" class="horario-conteudo"><p class="horario-carregando">Carregando horário da turma…</p></div>
</section>
<main>
    <section class="filtro filtro-agenda">
        <div class="filtro-campo">
            <label for="data">Pesquisar por data:</label>
            <input type="date" id="data" onchange="filtrarPorData()">
        </div>
        <div class="filtro-campo">
            <label for="botao-materias">Pesquisar por matéria:</label>
            <div class="seletor-materias">
                <button type="button" id="botao-materias" class="botao-materias" aria-expanded="false" aria-controls="painel-materias">
                    <span id="resumo-materias" class="resumo-materias">Todas as matérias</span>
                    <span class="seta">▼</span>
                </button>
                <div id="painel-materias" class="painel-materias">
                    <label class="opcao-materia"><input type="checkbox" value="Ciências"><span>Ciências</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Matemática"><span>Matemática</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Português"><span>Português</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Redação"><span>Redação</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Bilíngue"><span>Bilíngue</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Artes"><span>Artes</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Robótica"><span>Robótica</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Ed. Física"><span>Ed. Física</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Socioemocional"><span>Socioemocional</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Literatura"><span>Literatura</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Gramática"><span>Gramática</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="História"><span>História</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Química"><span>Química</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Geografia"><span>Geografia</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Física"><span>Física</span></label>
                    <label class="opcao-materia"><input type="checkbox" value="Lembrete"><span>Lembrete</span></label>
                </div>
            </div>
            <p class="ajuda-materias">Selecione quantas matérias quiser.</p>
        </div>
        <button type="button" id="botao-mostrar-todas">Mostrar todas</button>
    </section>
    <div class="area-adicionar" id="area-adicionar" style="display: none;"><button class="botao-adicionar" onclick="abrirFormulario()">+ Adicionar tarefas</button></div>
    <section id="formulario" class="formulario" style="display: none;"><h2>Adicionar tarefas</h2><label for="nova-data">Data:</label><input type="date" id="nova-data" onchange="mostrarMateriasDoDia()"><div id="lista-materias-formulario"></div><div class="botoes-formulario"><button onclick="adicionarTarefasDoDia()">Adicionar tarefas</button><button class="cancelar" onclick="fecharFormulario()">Cancelar</button></div></section>
    <section id="lista-tarefas"></section>
    <section id="modal-senha" class="modal-senha"><div class="conteudo-modal"><h2>Alterar senha</h2><p id="usuario-senha"></p><input type="password" id="senha-alterada" placeholder="Digite a nova senha"><div class="botoes-modal"><button onclick="confirmarAlteracaoSenha()">Alterar senha</button><button class="cancelar" onclick="fecharModalSenha()">Cancelar</button></div></div></section>
</main>
<script src="agenda-logica.js?v=20260909-agenda-fix"></script><script src="global-temas.js?v=20260907-lightfix5"></script><script src="agenda-temas-integracao.js?v=20260907-3"></script><script src="agenda-painel-admin.js?v=20260907-1"></script><script src="agenda-horarios.js?v=20260907-1"></script><script src="agenda-configuracao-horario.js?v=20261015-1"></script><script src="global-notificacoes.js?v=20260918"></script>
<script>
(function () {
    const materias = () => Array.from(document.querySelectorAll('#painel-materias input[type="checkbox"]'));

    async function carregarMateriasDoCatalogo() {
        try {
            const resposta = await fetch("/api/materias", { cache: "no-store" });
            if (!resposta.ok) return;
            const dados = await resposta.json();
            if (!dados.sucesso || !Array.isArray(dados.materias)) return;
            const painel = document.getElementById("painel-materias");
            const selecionadas = new Set(materias().filter(c => c.checked).map(c => c.value));
            painel.replaceChildren();
            dados.materias.forEach(materia => {
                const label = document.createElement("label");
                label.className = "opcao-materia";
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = materia.nome;
                checkbox.checked = selecionadas.has(materia.nome);
                const texto = document.createElement("span");
                texto.textContent = materia.nome;
                label.append(checkbox, texto);
                painel.appendChild(label);
                checkbox.addEventListener("change", aplicarFiltroMateria);
            });
            atualizarResumo();
        } catch (erro) {
            console.warn("Não foi possível atualizar as matérias do filtro:", erro);
        }
    }

    function obterFiltros() {
        return {
            data: document.getElementById("data")?.value || "",
            materias: materias().filter(c => c.checked).map(c => c.value)
        };
    }

    function atualizarResumo() {
        const selecionadas = materias().filter(c => c.checked).map(c => c.value);
        const resumo = document.getElementById("resumo-materias");
        if (!resumo) return;
        if (selecionadas.length === 0) resumo.textContent = "Todas as matérias";
        else if (selecionadas.length <= 2) resumo.textContent = selecionadas.join(", ");
        else resumo.textContent = `${selecionadas.length} matérias selecionadas`;
    }

    function aplicarFiltroMateria() {
        atualizarResumo();
        aplicarFiltros();
    }

    window.filtrarPorData = function () { aplicarFiltros(); };
    window.filtrarPorMateria = aplicarFiltroMateria;

    // Limpa os dois filtros de forma direta, sem depender de onclick inline.
    function limparTodosOsFiltros(evento) {
        if (evento) {
            evento.preventDefault();
            evento.stopPropagation();
        }

        const data = document.getElementById("data");
        const painel = document.getElementById("painel-materias");
        const botao = document.getElementById("botao-materias");

        if (data) {
            data.value = "";
            data.dispatchEvent(new Event("input", { bubbles: true }));
        }

        materias().forEach(c => {
            c.checked = false;
            c.defaultChecked = false;
            c.removeAttribute("checked");
        });

        atualizarResumo();

        if (painel) painel.classList.remove("aberto");
        if (botao) {
            botao.classList.remove("aberto");
            botao.setAttribute("aria-expanded", "false");
        }

        aplicarFiltros();
    }

    window.limparFiltro = limparTodosOsFiltros;

    async function aplicarFiltros() {
        const lista = document.getElementById("lista-tarefas");
        if (!lista) return;
        const { data, materias: materiasSelecionadas } = obterFiltros();
        try {
            const resposta = await fetch("/api/tarefas");
            const dados = await resposta.json();
            if (!dados.sucesso) {
                console.error(dados.mensagem);
                return;
            }
            lista.innerHTML = "";
            const tarefas = dados.tarefas
                .filter(tarefa => !data || tarefa.data === data)
                .filter(tarefa => materiasSelecionadas.length === 0 || materiasSelecionadas.includes(tarefa.materia))
                .sort((a, b) => {
                    const comparacaoData = b.data.localeCompare(a.data);
                    return comparacaoData !== 0 ? comparacaoData : b.id - a.id;
                });
            tarefas.forEach(tarefa => criarTarefa(tarefa.id, tarefa.data, tarefa.materia, tarefa.descricao, tarefa.dataEntrega, tarefa.subtitulo));
            if (tarefas.length === 0) {
                const mensagem = document.createElement("p");
                mensagem.textContent = data || materiasSelecionadas.length > 0
                    ? "Nenhuma tarefa encontrada com esses filtros."
                    : "Nenhuma tarefa cadastrada.";
                lista.appendChild(mensagem);
            }

            // A lista é montada por este filtro depois que a sessão é verificada.
            // Só então a tarefa do hash pode ser localizada e destacada.
            if (typeof abrirTarefaPeloHash === "function") {
                requestAnimationFrame(() => {
                    abrirTarefaPeloHash();
                });
            }
        } catch (erro) {
            console.error("Erro ao filtrar tarefas:", erro);
        }
    }

    const botaoMaterias = document.getElementById("botao-materias");
    const painelMaterias = document.getElementById("painel-materias");
    const botaoMostrarTodas = document.getElementById("botao-mostrar-todas");

    if (botaoMostrarTodas) {
        botaoMostrarTodas.addEventListener("click", limparTodosOsFiltros);
    }

    if (botaoMaterias && painelMaterias) {
        botaoMaterias.addEventListener("click", function () {
            const aberto = painelMaterias.classList.toggle("aberto");
            botaoMaterias.classList.toggle("aberto", aberto);
            botaoMaterias.setAttribute("aria-expanded", String(aberto));
        });
        document.addEventListener("click", function (evento) {
            if (!evento.target.closest(".seletor-materias")) {
                painelMaterias.classList.remove("aberto");
                botaoMaterias.classList.remove("aberto");
                botaoMaterias.setAttribute("aria-expanded", "false");
            }
        });
        materias().forEach(c => c.addEventListener("change", aplicarFiltroMateria));
    }

    window.carregarTarefas = aplicarFiltros;
    carregarMateriasDoCatalogo();
})();
</script>
</body></html>
