<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 480"
     class="nexo-logo"
     role="img"
     aria-label="Nexo">

  <g class="nexo-logo__graphic">
    <circle cx="306.11" cy="143.72" r="99.43"
            fill="var(--nexo-logo-accent, #ff5656)"
            stroke="var(--nexo-logo-outline, #000000)"
            stroke-width="5"/>

    <circle cx="97.61" cy="315.22" r="53.88"
            fill="var(--nexo-logo-accent, #ff5656)"
            stroke="var(--nexo-logo-outline, #000000)"
            stroke-width="5"/>

    <circle cx="489.11" cy="302.22" r="97"
            fill="var(--nexo-logo-accent, #ff5656)"
            stroke="var(--nexo-logo-outline, #000000)"
            stroke-width="5"/>

    <g fill="none"
       stroke="var(--nexo-logo-outline, #000000)"
       stroke-width="20">
      <line x1="133.11" y1="275.22"
            x2="224.11" y2="201.22"/>
      <line x1="416.11" y1="240.22"
            x2="381.11" y2="210.22"/>
    </g>

    <text x="323.04" y="394.27"
          fill="var(--nexo-logo-text, #ffffff)"
          font-family="Serif"
          font-size="171.68"
          text-anchor="middle">NEXO</text>
  </g>
</svg>
