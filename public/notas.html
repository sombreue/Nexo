<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="icon" href="/imagens/svg-nexo.svg"><title>Notas e médias — Agenda auruda</title><link rel="stylesheet" href="global-temas-estilos.css?v=20260916-notas"><link rel="stylesheet" href="notas-estilos.css?v=20260916-materias"><script>document.documentElement.dataset.theme=localStorage.getItem('agenda-auruda-tema')||'ruby';</script>
</head>
<body>
<header class="topo"><a href="/area-aluno.html" class="voltar">← Área do aluno</a><div><h1>Notas e médias</h1><p>Acompanhe suas notas por matéria e período.</p></div><button id="sair" class="sair" type="button">Sair</button></header>
<main>
<section class="resumo"><div><strong id="media-geral">—</strong><span>Média geral</span></div><div><strong id="melhor-media">—</strong><span>Melhor matéria</span></div><div><strong id="materias">0</strong><span>Matérias</span></div><div><strong id="lancamentos">0</strong><span>Notas lançadas</span></div></section>
<section class="barra"><button id="nova-nota" type="button">+ Nova nota</button><select id="filtro-materia" aria-label="Filtrar por matéria"><option value="">Todas as matérias</option></select><select id="filtro-periodo" aria-label="Filtrar por período"><option value="">Todos os períodos</option><option>1º bimestre</option><option>2º bimestre</option><option>3º bimestre</option><option>4º bimestre</option></select></section>
<section id="painel" class="painel" hidden><h2 id="titulo-form">Adicionar nota</h2><form id="form-nota"><div class="grid"><label>Matéria<select id="materia" required><option value="">Selecione a matéria</option></select></label><label>Período<select id="periodo"><option>1º bimestre</option><option>2º bimestre</option><option>3º bimestre</option><option>4º bimestre</option></select></label><label>Nota<input id="nota" type="number" min="0" max="10" step="0.01" required placeholder="0 a 10"></label></div><label class="descricao-label">Observação <span>(opcional)</span><textarea id="descricao" maxlength="1000" rows="3" placeholder="Ex.: prova, trabalho, recuperação..."></textarea></label><div class="botoes"><button type="submit">Salvar nota</button><button id="cancelar" class="secundario" type="button">Cancelar</button></div><p id="mensagem"></p></form></section>
<section id="lista" class="lista"></section>
</main><script src="global-materias.js?v=20260916"></script><script src="global-temas.js?v=20260916"></script><script src="notas-logica.js?v=20260916-sem-peso"></script>
</body></html>
